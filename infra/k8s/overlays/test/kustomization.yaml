# Test deployment on saubera.42cloudz.com, kept out of search engines (NOINDEX=1).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: saubera
resources:
  - ../../base
  - certificate.yaml
  - ingressroute.yaml
patches:
  - target: { kind: Deployment, name: web }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: NOINDEX, value: "1" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: SITE_URL, value: "https://saubera.42cloudz.com" }
images:
  # CI rewrites this line on the branch `deploy` (see .gitlab-ci.yml, deploy).
  - name: registry.gitlab.com/42cloudz/saubera/web
    newTag: latest # ci-web
