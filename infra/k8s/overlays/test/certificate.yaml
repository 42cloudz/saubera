apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: saubera-tls
  namespace: saubera
spec:
  dnsNames:
    - saubera.42cloudz.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: saubera-tls
  usages:
    - digital signature
    - key encipherment
